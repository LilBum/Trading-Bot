<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trading Planner Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient-shape"></div>
    <header class="site-header">
      <div>
        <p class="eyebrow">1DTE Options Planner</p>
        <h1>Signal Board</h1>
        <p class="subhead">
          Live summaries of plan cards. This is a decision aid, not execution.
        </p>
      </div>
      <div class="status-panel">
        <div class="status-pill" id="status-pill">Connecting</div>
        <div class="status-meta">
          <span id="last-updated">Last update: --</span>
          <span id="refresh-note">Auto refresh enabled</span>
        </div>
      </div>
    </header>

    <main>
      <section class="alert" id="alert" hidden></section>
      <section class="summary" id="summary"></section>
      <section class="performance" id="performance"></section>
      <section class="rejects" id="rejects"></section>
      <section class="cards" id="cards"></section>
      <section class="empty-state" id="empty-state" hidden>
        <h2>No plans yet</h2>
        <p>Waiting for the first refresh. This can take a minute.</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Local dashboard</span>
      <span id="clock">--</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
